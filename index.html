<style>

    --line:#f6e7dc; --shadow-sm:0 4px 18px rgba(255,138,101,.12);
    --shadow:0 12px 40px rgba(255,138,101,.18);
    --emoji:"Apple Color Emoji","Segoe UI Emoji","Segoe UI Symbol","Noto Color Emoji",sans-serif;

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;

  .wrap{max-width:520px;margin:0 auto;padding:28px 20px 48px}

  .view.show{display:block;animation:fadeUp .5s ease both}

  @keyframes shake{0%,100%{transform:none}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
  .shake{animation:shake .4s ease}

  /* 口令门控 */
  #gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;
    padding:20px;background:linear-gradient(135deg,rgba(255,248,231,.97),rgba(240,251,246,.97));
    backdrop-filter:blur(8px)}
  #gate.hide{display:none}
  .gate-card{background:#fff;border:1px solid var(--line);border-radius:26px;box-shadow:var(--shadow);
    padding:38px 30px 32px;width:100%;max-width:400px;text-align:center}
  .gate-lock{font-size:46px;margin-bottom:8px;font-family:var(--emoji)}
  .gate-card h2{font-size:21px;margin:0 0 8px}
  .gsub{font-size:13.5px;color:var(--ink-2);line-height:1.7;margin:0 0 22px}
  #passInput{width:100%;text-align:center;font-size:22px;letter-spacing:10px;font-weight:800;
    padding:14px 12px 14px 24px;border:2px solid var(--pink-soft);border-radius:14px;
    color:var(--ink);font-family:inherit;outline:none;background:#fffdf8}
  #passInput:focus{border-color:var(--pink);box-shadow:0 0 0 4px rgba(255,154,118,.14)}
  .gate-msg{height:20px;font-size:12.5px;color:var(--pink-deep);margin:6px 0 12px;opacity:0;transition:opacity .2s}
  .gate-msg.on{opacity:1}
  .gate-foot{font-size:11px;color:var(--ink-3);margin:18px 0 0}

  /* 通用组件 */
  .btn{display:block;width:100%;border:0;border-radius:14px;padding:15px;font-size:16px;font-weight:800;
    color:#fff;background:linear-gradient(135deg,var(--pink),var(--pink-deep));
    box-shadow:var(--shadow-sm);cursor:pointer;font-family:inherit;margin-top:12px}
  .btn:active{transform:scale(.98)}
  .btn.ghost{background:#fff;color:var(--pink-deep);border:1.5px solid var(--pink-soft);box-shadow:none}
  .card{background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow-sm);
    padding:20px;margin-bottom:16px}
  h1{font-size:28px;line-height:1.35;margin:6px 0 14px}
  h1 .hl{color:var(--pink-deep)}
  h2{font-size:19px;line-height:1.5}
  .eyebrow{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--pink-deep);
    background:var(--pink-soft);padding:5px 12px;border-radius:999px;font-weight:700}
  .hero{text-align:center;padding:14px 8px 6px}
  .hero .big{font-size:66px;line-height:1;margin:8px 0 14px;font-family:var(--emoji)}
  .hero p{font-size:14.5px;color:var(--ink-2);line-height:1.75}

  .meta{font-size:12px;color:var(--ink-2);background:#fff;border:1px solid var(--line);
    border-radius:999px;padding:6px 13px}
  .progress-track{height:8px;background:var(--pink-soft);border-radius:99px;overflow:hidden;margin:14px 0 6px}
  .bar-fill{display:block;height:100%;width:0;border-radius:99px;
    background:linear-gradient(90deg,var(--mint),var(--pink));transition:width .5s ease}
  .qcount{font-size:12.5px;color:var(--ink-3);margin:0 0 12px}
  .option{display:flex;align-items:flex-start;gap:12px;padding:14px;border:1.5px solid var(--line);
    border-radius:14px;margin-bottom:10px;cursor:pointer;background:#fff;transition:.18s;font-size:14.5px;line-height:1.55}
  .option:hover{transform:translateY(-2px);border-color:var(--pink-soft)}
  .option.on{border-color:var(--pink);background:#fff6ef}
  .opt-key{flex:0 0 26px;height:26px;border-radius:50%;background:var(--pink-soft);color:var(--pink-deep);
    font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;margin-top:1px}
  .option.on .opt-key{background:var(--pink);color:#fff}
  .type-emoji{font-size:56px;line-height:1;margin-bottom:6px;font-family:var(--emoji)}
  .kw{display:inline-block;font-size:12px;color:var(--pink-deep);background:var(--pink-soft);

  .golden b{color:var(--mint)}
  .subblock{background:linear-gradient(135deg,#fffdf8,#f4fbf7);border:1px solid var(--line);
    border-radius:14px;padding:13px 15px;margin-top:12px;font-size:13px;line-height:1.7;color:var(--ink-2)}
  .subblock .t{color:var(--pink-deep);font-weight:800;margin-right:5px}
  .disclaimer{font-size:11px;color:var(--ink-3);line-height:1.7;text-align:center;margin-top:22px}

  /* 海报弹层 */
  #posterModal{display:none;position:fixed;inset:0;z-index:9998;background:rgba(90,70,60,.6);
    align-items:center;justify-content:center;padding:20px}
  #posterModal.show{display:flex}
  .poster-box{background:#fff;border-radius:20px;padding:16px;max-width:400px;width:100%;text-align:center;
    box-shadow:var(--shadow);max-height:92vh;overflow:auto}
  #posterImg{width:100%;border-radius:12px;display:block}
  .poster-tip{font-size:11.5px;color:var(--ink-3);margin:8px 0 0}
  #toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%) translateY(20px);
    background:rgba(90,70,60,.94);color:#fff;padding:10px 20px;border-radius:99px;font-size:13px;
    opacity:0;pointer-events:none;transition:.3s;z-index:10000;white-space:nowrap}
  #toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style>

<script>
/* ============ 口令门控 ============ */
var PASSCODE = "7798"; // 4 位数字口令，可自行修改此处

function verify(){
  var inp = document.getElementById('passInput');
  var msg = document.getElementById('gateMsg');
  var card = document.getElementById('gateCard');
  if(inp.value.trim() === PASSCODE){
    document.getElementById('gate').classList.add('hide');
    show('home');
  }else{
    msg.classList.add('on');
    card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');
    inp.value = ''; inp.focus();
  }
}
document.getElementById('verifyBtn').addEventListener('click', verify);
document.getElementById('passInput').addEventListener('input', function(){
  this.value = this.value.replace(/\D/g,'').slice(0,4);
  this.closest('.gate-card').querySelector('.gate-msg').classList.remove('on');
});
document.getElementById('passInput').addEventListener('keydown', function(e){
  if(e.key === 'Enter') verify();
});

/* ============ 计分逻辑 ============ */
// 平局兜底：先比最后一题所选 -> 再比第一题所选 -> 再取编号靠前者
function resolve(answers){
  var s = {};
  answers.forEach(function(ch,i){
    var code = QUESTIONS[i].options[ch].code;
    s[code] = (s[code]||0) + 1;
  });
  var keys = Object.keys(s);
  var mx = Math.max.apply(null, keys.map(function(k){return s[k];}));
  var tied = keys.filter(function(k){return s[k]===mx;});
  var code;
  if(tied.length === 1){ code = tied[0]; }
  else{
    var last = QUESTIONS[QUESTIONS.length-1].options[answers[QUESTIONS.length-1]].code;
    var first = QUESTIONS[0].options[answers[0]].code;
    if(tied.indexOf(last) >= 0) code = last;
    else if(tied.indexOf(first) >= 0) code = first;
    else code = tied.sort()[0];
  }
  return {code:code, scores:s};
}

/* ============ 视图切换 ============ */
function show(id){
  ['home','quiz','result'].forEach(function(v){
    document.getElementById(v).classList.toggle('show', v === id);
  });
  window.scrollTo(0,0);
}

/* ============ 答题流程 ============ */
var answers = new Array(QUESTIONS.length).fill(-1);
var cur = 0;
var lastResultCode = '';
var lastScores = {};

function renderQuiz(){
  var q = QUESTIONS[cur];
  document.getElementById('qIndex').textContent = '第 ' + (cur+1) + ' / ' + QUESTIONS.length + ' 题';
  document.getElementById('progressFill').style.width = ((cur)/QUESTIONS.length*100) + '%';
  document.getElementById('qTitle').textContent = q.title;
  var box = document.getElementById('options');
  box.innerHTML = '';
  q.options.forEach(function(o,i){
    var el = document.createElement('div');
    el.className = 'option' + (answers[cur] === i ? ' on' : '');
    el.innerHTML = '<span class="opt-key">' + o.key + '</span><span>' + o.text + '</span>';
    el.addEventListener('click', function(){ selectOption(i); });
    box.appendChild(el);
  });
}

function selectOption(i){
  answers[cur] = i;
  renderQuiz();
  var opts = document.querySelectorAll('#options .option');
  if(opts[i]) opts[i].classList.add('on');
  setTimeout(function(){
    if(cur < QUESTIONS.length - 1){ cur++; renderQuiz(); }
    else{ finish(); }
  }, 260);
}

function finish(){
  var res = resolve(answers);
  lastResultCode = res.code;
  lastScores = res.scores;
  var r = RESULTS[res.code];
  document.getElementById('rEmoji').textContent = r.emoji;
  document.getElementById('rName').textContent = r.name;
  document.getElementById('rPersona').textContent = r.persona;
  var kwBox = document.getElementById('rKeywords');
  kwBox.innerHTML = '';
  r.kw.forEach(function(k){ var s=document.createElement('span'); s.className='kw'; s.textContent=k; kwBox.appendChild(s); });
  var insBox = document.getElementById('rInsight');
  insBox.innerHTML = '';
  r.insight.forEach(function(t,i){
    var p = document.createElement('p');
    p.className = 'insight' + (i === 2 ? ' golden' : '');
    var lines = t.split(' ');
    p.innerHTML = '<b>' + lines[0] + '</b>' + lines.slice(1).join(' ') + (i===2?'':'');
    insBox.appendChild(p);
  });
  document.getElementById('rScene').innerHTML = '<span class="t">🎬 同款场景</span>' + r.scene;
  document.getElementById('rMatch').innerHTML = '<span class="t">💞 适配关系</span>' + r.match;
  document.getElementById('progressFill').style.width = '100%';
  show('result');
}

document.getElementById('startBtn').addEventListener('click', function(){
  answers = new Array(QUESTIONS.length).fill(-1); cur = 0; renderQuiz(); show('quiz');
});
document.getElementById('backBtn').addEventListener('click', function(){
  if(cur > 0){ cur--; renderQuiz(); }
});
document.getElementById('againBtn').addEventListener('click', function(){ show('home'); });

/* ============ Canvas 结果海报 ============ */
function rr(c,x,y,w,h,r){
  c.beginPath();
  c.moveTo(x+r,y);
  c.lineTo(x+w-r,y); c.quadraticCurveTo(x+w,y,x+w,y+r);
  c.lineTo(x+w,y+h-r); c.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  c.lineTo(x+r,y+h); c.quadraticCurveTo(x,y+h,x,y+h-r);
  c.lineTo(x,y+r); c.quadraticCurveTo(x,y,x+r,y);
  c.closePath();
}
function wrapText(c,text,x,y,maxW,lineH){
  var line = '';
  for(var i=0;i<text.length;i++){
    var ch = text[i];
    if(c.measureText(line+ch).width > maxW && line){ c.fillText(line,x,y); line=ch; y+=lineH; }
    else{ line += ch; }
  }
  if(line){ c.fillText(line,x,y); y+=lineH; }
  return y;
}

  c.fillStyle = g; c.fillRect(0,0,W,H);

  y = 96;
  c.font = '104px ' + EF;
  c.fillText(r.emoji, W/2, y+96); y += 130;

  c.fillText(DIMS[lastResultCode.charAt(0)] + ' · ' + r.name, W/2, y); y += 40;

  y = wrapText(c, r.persona, W/2, y+26, CW, 36) + 6;

  // 关键词胶囊
  c.font = 'bold 20px -apple-system,"PingFang SC",sans-serif';

  r.kw.forEach(function(k){ totalW += c.measureText(k).width + 36; });
  totalW += gaps*(r.kw.length-1);

  r.kw.forEach(function(k){
    var kw = c.measureText(k).width + 36;
    c.fillStyle = '#ffe0cc'; rr(c,kx,y,kw,38,19); c.fill();
    c.fillStyle = '#ff7043'; c.textAlign='center'; c.fillText(k, kx+kw/2, y+26);
    kx += kw + gaps;
  });
  y += 62;

  // 三段解读卡片
  var contentX = PAD+24, contentW = CW-48;
  r.insight.forEach(function(t,i){
    var parts = t.split(' ');
    var head = parts[0], body = parts.slice(1).join(' ');

    c.font = 'bold 23px -apple-system,"PingFang SC",sans-serif';

    c.font = (isGold?'bold ':'') + '21px -apple-system,"PingFang SC",sans-serif';
    var ny = wrapText(c, body, contentX, y+26+hh, contentW, 33);

    // 先画背景需前置，这里采用描边分隔避免覆盖文字
    c.strokeStyle = isGold ? 'rgba(63,201,176,.45)' : 'rgba(246,231,220,.9)';
    c.lineWidth = 1.5;
    c.beginPath(); c.moveTo(contentX, cardBottom); c.lineTo(contentX+contentW, cardBottom); c.stroke();
    y = cardBottom + 18;
  });

  // 同款场景 & 适配关系
  c.textAlign='left';
  c.fillStyle='#ff7043'; c.font='bold 20px -apple-system,"PingFang SC",sans-serif';
  c.fillText('🎬 同款场景', PAD, y+22);
  c.fillStyle='#6b5a50'; c.font='19px -apple-system,"PingFang SC",sans-serif';
  y = wrapText(c, r.scene, PAD, y+52, CW, 29) + 10;
  c.fillStyle='#ff7043'; c.font='bold 20px -apple-system,"PingFang SC",sans-serif';
  c.fillText('💞 适配关系', PAD, y+22);
  c.fillStyle='#6b5a50'; c.font='19px -apple-system,"PingFang SC",sans-serif';
  y = wrapText(c, r.match, PAD, y+52, CW, 29) + 14;

  // 四维能量条
  c.fillStyle='#8b7468'; c.font='bold 19px -apple-system,"PingFang SC",sans-serif';
  c.fillText('磁场能量分布', PAD, y+20); y += 40;
  ['A','B','C','D'].forEach(function(dk){
    var dimScore = (lastScores[dk+'1']||0)+(lastScores[dk+'2']||0)+(lastScores[dk+'3']||0);
    c.fillStyle='#5a463c'; c.font='18px -apple-system,"PingFang SC",sans-serif';
    c.fillText(DIMS[dk], PAD, y+14);
    var bx = PAD+130, bw = CW-130-60, by = y+2;
    c.fillStyle='rgba(255,154,118,.22)'; rr(c,bx,by,bw,16,8); c.fill();
    var fg = c.createLinearGradient(bx,0,bx+bw,0);
    fg.addColorStop(0,'#3fc9b0'); fg.addColorStop(1,'#ff9a76');
    c.fillStyle=fg; rr(c,bx,by,Math.max(6,bw*dimScore/QUESTIONS.length),16,8); c.fill();
    c.fillStyle='#8b7468'; c.textAlign='right'; c.fillText(String(dimScore), W-PAD, y+14); c.textAlign='left';
    y += 34;
  });

  // @引导
  y += 8;
  c.textAlign='center'; c.fillStyle='#ff7043'; c.font='bold 22px -apple-system,"PingFang SC",sans-serif';
  c.fillText('@ 那个你第一时间想到的人，一起测测 ✨', W/2, y+20);

  // 免责声明
  c.fillStyle='#b7a398'; c.font='16px -apple-system,"PingFang SC",sans-serif';
  c.fillText('本测试为趣味娱乐内容，结果由算法生成，仅供娱乐参考，', W/2, H-46);
  c.fillText('不构成任何心理诊断或情感建议。', W/2, H-22);

  var dataURL = cv.toDataURL('image/png');
  document.getElementById('posterImg').src = dataURL;
  document.getElementById('posterDownload').href = dataURL;
  document.getElementById('posterModal').classList.add('show');
}

document.getElementById('posterBtn').addEventListener('click', genPoster);
document.getElementById('posterClose').addEventListener('click', function(){
  document.getElementById('posterModal').classList.remove('show');
});
document.getElementById('posterDownload').addEventListener('click', function(){
  toast('图片已开始下载');
});

/* ============ 工具 ============ */
var toastTimer = null;
function toast(msg){
  var t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.classList.remove('on'); }, 1800);
}
</script>
</body>
</html>
