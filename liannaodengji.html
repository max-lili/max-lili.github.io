<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>你的恋爱脑几级？｜趣味人格测试</title>
<style>
:root{
  --pink:#ff7a9c;
  --pink-deep:#ff5c85;
  --pink-soft:#ffe4ec;
  --cream:#fffaf7;
  --ink:#4a3b45;
  --ink-2:#7c6974;
  --ink-3:#a8929c;
  --line:#f3e2e8;
  --shadow-sm:0 4px 18px rgba(255,122,156,.12);
  --shadow:0 12px 40px rgba(255,122,156,.18);
  --r:22px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Helvetica Neue",sans-serif;
  background:linear-gradient(135deg,#fff5f8 0%,#f7f5ff 45%,#f1f8ff 100%);
  color:var(--ink);
  min-height:100vh;
  padding:26px 16px 44px;
  display:flex;
  justify-content:center;
  line-height:1.75;
  -webkit-font-smoothing:antialiased;
}
.wrap{width:100%;max-width:520px}
.emoji{font-family:"Apple Color Emoji","Segoe UI Emoji","Segoe UI Symbol","Noto Color Emoji",sans-serif}

/* ---------- 视图切换 ---------- */
.view{display:none}
.view.show{display:block;animation:fadeUp .55s cubic-bezier(.2,.7,.3,1) both}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.9);opacity:0}60%{transform:scale(1.02)}100%{transform:scale(1);opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}

/* ---------- 通用 ---------- */
.btn{
  display:block;width:100%;border:0;cursor:pointer;
  background:linear-gradient(135deg,var(--pink) 0%,var(--pink-deep) 100%);
  color:#fff;font-size:17px;font-weight:600;letter-spacing:.5px;
  padding:15px 20px;border-radius:16px;box-shadow:var(--shadow-sm);
  font-family:inherit;transition:transform .18s,box-shadow .18s;
  min-height:48px;
}
.btn:active{transform:scale(.97)}
.btn.ghost{background:#fff;color:var(--ink-2);border:1px solid var(--line);box-shadow:none;font-weight:500;font-size:15px}
.card{background:#fff;border-radius:var(--r);border:1px solid var(--line);box-shadow:var(--shadow-sm);padding:22px}
.disc{font-size:12px;color:var(--ink-3);text-align:center;line-height:1.7;margin:18px 2px 0}

/* ---------- 口令门控 ---------- */
#gate{max-width:420px;margin:8vh auto 0}
.gate-card{
  background:#fff;border-radius:26px;padding:34px 26px 26px;text-align:center;
  border:1px solid var(--line);box-shadow:var(--shadow);
}
.gate-lock{font-size:40px;line-height:1;margin-bottom:14px}
.gate-card h2{font-size:19px;margin:0 0 8px;font-weight:700}
.gsub{font-size:13.5px;color:var(--ink-3);margin:0 0 20px}
.input-wrap{margin-bottom:10px}
#passInput{
  width:100%;padding:15px 16px;border-radius:14px;border:1.5px solid var(--line);
  background:#fffafc;font-size:20px;text-align:center;letter-spacing:.5em;text-indent:.5em;
  color:var(--ink);outline:none;font-family:inherit;
}
#passInput:focus{border-color:var(--pink);background:#fff}
.gate-msg{font-size:13px;color:#ff5c85;height:20px;opacity:0;transition:opacity .2s}
.gate-msg.on{opacity:1}
.gate-foot{font-size:11.5px;color:var(--ink-3);margin:16px 0 0}
.shake{animation:shake .4s}

/* ---------- 首页 ---------- */
.home-card{
  background:#fff;border-radius:30px;padding:26px 26px 28px;text-align:center;
  border:1px solid var(--line);box-shadow:var(--shadow);overflow:hidden;
}
.cover{width:100%;max-width:250px;margin:0 auto 18px}
.cover svg{width:100%;height:auto;display:block}
.eyebrow{display:inline-block;font-size:12.5px;color:var(--pink-deep);background:var(--pink-soft);padding:4px 12px;border-radius:99px;letter-spacing:1px;margin-bottom:14px}
h1{font-size:34px;line-height:1.35;margin:0 0 12px;font-weight:800;letter-spacing:1px}
h1 em{font-style:normal;color:var(--pink-deep);position:relative}
h1 em::after{content:"";position:absolute;left:-2px;right:-2px;bottom:2px;height:9px;background:var(--pink-soft);z-index:-1;border-radius:6px}
.sub{font-size:14.5px;color:var(--ink-2);margin:0 0 8px}
.meta{font-size:12.5px;color:var(--ink-3);margin:0 0 22px;letter-spacing:.5px}
.foot{font-size:12px;color:var(--ink-3);margin:14px 0 0}

/* ---------- 答题 ---------- */
.quiz-card{background:#fff;border-radius:26px;padding:22px 22px 20px;border:1px solid var(--line);box-shadow:var(--shadow-sm)}
.qhead{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink-3);margin-bottom:8px;letter-spacing:.5px}
.bar{height:7px;background:#f8edf1;border-radius:99px;overflow:hidden;margin-bottom:22px}
.bar-fill{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--pink),var(--pink-deep));transition:width .35s cubic-bezier(.3,.8,.4,1)}
.q-title{font-size:20px;line-height:1.6;font-weight:700;margin:0 0 20px;padding:0 2px;animation:fadeUp .4s both}
.options{display:flex;flex-direction:column;gap:11px}
.option{
  display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;cursor:pointer;
  background:#fffafc;border:1.5px solid #f7e9ef;border-radius:16px;padding:14px 15px;
  font-size:15px;color:var(--ink);font-family:inherit;line-height:1.6;
  transition:transform .16s,border-color .16s,background .16s,box-shadow .16s;
}
.option:hover{transform:translateY(-2px);border-color:#ffc9d8;background:#fff}
.option .ltr{
  flex:0 0 26px;height:26px;border-radius:50%;background:var(--pink-soft);color:var(--pink-deep);
  font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:1px;
  transition:background .16s,color .16s;
}
.option.sel{border-color:var(--pink);background:#fff2f6;box-shadow:0 6px 20px rgba(255,122,156,.16)}
.option.sel .ltr{background:var(--pink-deep);color:#fff}
.back{margin-top:14px}
.back .btn{width:auto;padding:11px 18px;font-size:14px}

/* ---------- 结果 ---------- */
.result-card{background:#fff;border-radius:28px;padding:24px 22px 22px;border:1px solid var(--line);box-shadow:var(--shadow);text-align:center;animation:pop .6s both}
.artbox{width:100%;max-width:220px;margin:0 auto 14px}
.artbox svg{width:100%;height:auto;display:block}
.lvl{font-size:13px;color:var(--ink-3);letter-spacing:2px;margin-bottom:2px}
.lvl b{color:var(--pink-deep);font-size:22px;letter-spacing:1px;margin-left:4px}
.dimtag{display:inline-block;font-size:12px;color:var(--ink-2);background:#fbf3f6;border-radius:99px;padding:3px 12px;margin-bottom:6px}
.r-name{font-size:26px;font-weight:800;margin:6px 0 6px;letter-spacing:1px}
.persona{font-size:14px;color:var(--ink-2);margin:0 0 16px;padding:0 6px}
.kwrow{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.kw{font-size:12.5px;color:var(--pink-deep);background:var(--pink-soft);border-radius:99px;padding:5px 13px}
.insight{text-align:left;display:flex;flex-direction:column;gap:14px}
.isec{background:#fffafc;border:1px solid #f7e9ef;border-radius:18px;padding:14px 16px}
.isec .ih{font-size:13px;font-weight:700;color:var(--pink-deep);margin-bottom:6px;letter-spacing:.5px}
.isec p{margin:0;font-size:14.5px;color:var(--ink);line-height:1.85}
.isec.quote{background:linear-gradient(135deg,#fff2f6,#fff8ef);border-color:#ffdde6}
.isec.quote p{font-size:16px;font-weight:700;color:#c9385f;text-align:center;letter-spacing:.5px}
.dimbars{margin:20px 0 0;text-align:left}
.dh{font-size:12.5px;color:var(--ink-3);margin:0 0 10px;letter-spacing:.5px}
.drow{display:flex;align-items:center;gap:10px;margin-bottom:9px;font-size:12px;color:var(--ink-2)}
.drow .dn{flex:0 0 84px;color:var(--ink-2)}
.drow .dtrack{flex:1;height:8px;background:#f8edf1;border-radius:99px;overflow:hidden}
.drow .dfill{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#ffb0c6,var(--pink-deep))}
.drow .dv{flex:0 0 22px;text-align:right;color:var(--ink-3)}
.match{margin:18px 0 4px;font-size:13px;color:var(--ink-2);text-align:left;background:#f7fbff;border:1px solid #e8f1fb;border-radius:16px;padding:12px 15px}
.match b{color:#4a7fb5}
.scene{margin-top:10px;font-size:12.5px;color:var(--ink-3);text-align:left;padding-left:2px}
.rbtns{margin-top:20px;display:flex;flex-direction:column;gap:10px}

/* ---------- 海报弹层 ---------- */
#posterModal{position:fixed;inset:0;background:rgba(58,36,44,.62);display:none;align-items:center;justify-content:center;padding:20px;z-index:99;backdrop-filter:blur(3px)}
#posterModal.show{display:flex;animation:fadeUp .3s both}
.pm-card{background:#fff;border-radius:24px;padding:16px;width:100%;max-width:380px;max-height:92vh;overflow:auto;text-align:center}
.pm-head{font-size:12.5px;color:var(--ink-3);margin-bottom:10px}
#posterImg{width:100%;border-radius:14px;display:block;margin-bottom:12px;background:#faf5f8}
.pm-card .btn{margin-bottom:8px}

/* ---------- toast ---------- */
#toast{position:fixed;left:50%;bottom:40px;transform:translateX(-50%) translateY(20px);background:rgba(74,59,69,.9);color:#fff;font-size:13.5px;padding:10px 18px;border-radius:99px;opacity:0;transition:all .3s;pointer-events:none;z-index:200;white-space:nowrap}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

@media (max-width:400px){
  h1{font-size:29px}
  .q-title{font-size:18px}
  .r-name{font-size:23px}
}
</style>
</head>

<div id="posterModal">

</div>
<div id="toast"></div>
</div>

/* 选项文案：与上面每题四个选项按下标一一对应 */
var QTEXT = [

/* 计分：最高分胜出；平局兜底 = 最后一题所选 -> 第一题所选 -> 编号靠前 */
function resolve(ans){
  var s = {};
  ans.forEach(function(ch, i){
    var code = QUESTIONS[i].options[ch].code;
    s[code] = (s[code] || 0) + 1;
  });
  var mx = 0;
  Object.keys(s).forEach(function(k){ if(s[k] > mx) mx = s[k]; });
  var tied = Object.keys(s).filter(function(k){ return s[k] === mx; });
  var code;
  if(tied.length === 1){
    code = tied[0];
  }else{
    var lastQ = QUESTIONS.length - 1;
    var last = QUESTIONS[lastQ].options[ans[lastQ]].code;
    var first = QUESTIONS[0].options[ans[0]].code;
    if(tied.indexOf(last) >= 0) code = last;
    else if(tied.indexOf(first) >= 0) code = first;
    else code = tied.sort()[0];
  }
  return { code: code, scores: s };
}

/* ============ 视图切换 ============ */
function show(id){
  ['gate','home','quiz','result'].forEach(function(v){
    document.getElementById(v).classList.remove('show');
  });
  var el = document.getElementById(id);
  el.classList.add('show');
  el.parentNode && window.scrollTo({top:0,behavior:'smooth'});
}
function toast(msg){
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('on');
  clearTimeout(t._tm);
  t._tm = setTimeout(function(){ t.classList.remove('on'); }, 1600);
}

/* ============ 口令门控 ============ */
function verify(){
  var inp = document.getElementById('passInput');
  var msg = document.getElementById('gateMsg');
  var card = document.getElementById('gateCard');
  if(inp.value.trim() === PASSCODE){
    document.getElementById('gate').classList.remove('show');
    show('home');
  }else{
    msg.classList.add('on');
    card.classList.remove('shake');
    void card.offsetWidth;
    card.classList.add('shake');
    inp.value = '';
    inp.focus();
  }
}

/* ============ 答题 ============ */
var cur = 0, answers = [];

function renderQ(){
  var q = QUESTIONS[cur];
  document.getElementById('qIndex').textContent = (cur+1) + ' / ' + QUESTIONS.length;
  var pct = Math.round(cur / QUESTIONS.length * 100);
  document.getElementById('qPct').textContent = pct + '%';
  document.getElementById('barFill').style.width = pct + '%';
  document.getElementById('qTitle').textContent = q.title;
  var box = document.getElementById('options');
  box.innerHTML = '';
  q.options.forEach(function(op, i){
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'option' + (answers[cur] === i ? ' sel' : '');
    b.innerHTML = '<span class="ltr">' + op.key + '</span><span class="ot">' + op.text + '</span>';
    b.onclick = function(){ pick(i); };
    box.appendChild(b);
  });
  document.getElementById('backWrap').style.display = cur > 0 ? 'block' : 'none';
}

function pick(i){
  answers[cur] = i;
  var opts = document.getElementById('options').children;
  for(var k=0;k<opts.length;k++){ opts[k].classList.toggle('sel', k===i); }
  setTimeout(function(){
    if(cur < QUESTIONS.length - 1){ cur++; renderQ(); }
    else { finish(); }
  }, 260);
}

function back(){
  if(cur > 0){ cur--; renderQ(); }
}

/* ============ 维度分布 ============ */
function dimCounts(ans){
  var c = { A:0, B:0, C:0, D:0, E:0, F:0 };
  ans.forEach(function(ch,i){
    var code = QUESTIONS[i].options[ch].code;
    c[code.charAt(0)]++;
  });
  return c;
}

/* ============ 结果页 ============ */
var lastResult = null;

function finish(){
  var r = resolve(answers);
  lastResult = r;
  var code = r.code;
  var R = RESULTS[code];
  var dim = DIMS[code.charAt(0)];
  document.getElementById('artBox').innerHTML = artFor(code);
  document.getElementById('rLevel').textContent = 'Lv.' + R.lv;
  document.getElementById('rDim').textContent = '维度 · ' + dim;
  document.getElementById('rName').textContent = R.name;
  document.getElementById('rPersona').textContent = R.persona;
  document.getElementById('rKw').innerHTML = R.kw.map(function(k){ return '<span class="kw">' + k + '</span>'; }).join('');
  document.getElementById('rInsight').innerHTML =
      '<div class="isec"><div class="ih emoji">👀 一个画面</div><p>' + R.insight[0] + '</p></div>'
    + '<div class="isec"><div class="ih emoji">🌱 这是这样的你</div><p>' + R.insight[1] + '</p></div>'
    + '<div class="isec quote"><div class="ih emoji">✨ 一句话送给你</div><p>' + R.insight[2] + '</p></div>';
  document.getElementById('rMatch').innerHTML = '<b>适配关系</b>：' + R.match;
  document.getElementById('rScene').textContent = R.scene;

  var dc = dimCounts(answers);
  var mx = 0;
  Object.keys(dc).forEach(function(k){ if(dc[k] > mx) mx = dc[k]; });
  var html = '<div class="dh">六个侧面的浓度（你选中的选项落在哪一侧）</div>';
  Object.keys(DIMS).forEach(function(k){
    var v = dc[k];
    var w = mx ? Math.round(v / mx * 100) : 0;
    var minW = v > 0 ? 12 : 2;
    html += '<div class="drow"><span class="dn">' + DIMS[k] + '</span><span class="dtrack"><span class="dfill" style="width:' + Math.max(w, minW) + '%"></span></span><span class="dv">' + v + '</span></div>';
  });
  document.getElementById('rBars').innerHTML = html;
  show('result');
}

/* ============ 海报 ============ */
function wrapText(c, text, x, y, maxW, lineH, align){
  c.textAlign = align || 'left';
  var line = '';
  for(var i=0;i<text.length;i++){
    var ch = text.charAt(i);
    if(c.measureText(line + ch).width > maxW && line.length > 0){
      c.fillText(line, x, y);
      line = ch;
      y += lineH;
    }else{
      line += ch;
    }
  }
  if(line){ c.fillText(line, x, y); y += lineH; }
  return y;
}

function lineCount(c, text, maxW){
  var line = '', n = 0;
  for(var i=0;i<text.length;i++){
    var ch = text.charAt(i);
    if(c.measureText(line + ch).width > maxW && line.length > 0){
      n++; line = ch;
    }else{
      line += ch;
    }
  }
  if(line) n++;
  return n;
}

function roundRect(c, x, y, w, h, r){
  c.beginPath();
  c.moveTo(x+r, y);
  c.arcTo(x+w, y, x+w, y+h, r);
  c.arcTo(x+w, y+h, x, y+h, r);
  c.arcTo(x, y+h, x, y, r);
  c.arcTo(x, y, x+w, y, r);
  c.closePath();
}

function buildPoster(){
  var W = 750, H = 1500, PAD = 54;
  var cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  var c = cv.getContext('2d');
  var R = RESULTS[lastResult.code];
  var dim = DIMS[lastResult.code.charAt(0)];
  var CW = W - PAD * 2;
  var FS = '-apple-system,"PingFang SC","Microsoft YaHei",sans-serif';
  var EMO = '"Apple Color Emoji","Segoe UI Emoji","Segoe UI Symbol","Noto Color Emoji",sans-serif';

  var g = c.createLinearGradient(0, 0, W, H);
  g.addColorStop(0, '#FFF0F5');
  g.addColorStop(0.55, '#FFF7F0');
  g.addColorStop(1, '#F2F5FF');
  c.fillStyle = g;
  c.fillRect(0, 0, W, H);

  c.textAlign = 'center';
  c.fillStyle = '#B08A98';
  c.font = '600 24px ' + FS;
  c.fillText('我 的 恋 爱 脑 等 级', W / 2, 72);

  c.fillStyle = '#FF5C85';
  c.font = '800 66px ' + FS;
  c.fillText('Lv.' + R.lv, W / 2, 146);

  var barW = 420, barX = (W - barW) / 2;
  c.fillStyle = '#F5E4EA';
  roundRect(c, barX, 172, barW, 10, 5); c.fill();
  var g2 = c.createLinearGradient(barX, 0, barX + barW, 0);
  g2.addColorStop(0, '#FFC2D4'); g2.addColorStop(1, '#FF5C85');
  c.fillStyle = g2;
  roundRect(c, barX, 172, Math.max(10, Math.round(barW * R.lv / 18)), 10, 5); c.fill();

  c.fillStyle = '#4A3B45';
  c.font = '800 42px ' + FS;
  c.fillText(R.name, W / 2, 240);

  c.font = '500 20px ' + FS;
  var dt = '维度 · ' + dim;
  var dW = c.measureText(dt).width + 40;
  c.fillStyle = '#FDF1F5';
  roundRect(c, (W - dW) / 2, 260, dW, 36, 18); c.fill();
  c.fillStyle = '#93697A';
  c.fillText(dt, W / 2, 285);

  c.fillStyle = '#7C6974';
  c.font = '400 23px ' + FS;
  var y = wrapText(c, R.persona, W / 2, 342, CW - 40, 34, 'center');

  var pillY = y + 6;
  c.font = '600 19px ' + FS;
  var pW = [];
  var total = 0;
  R.kw.forEach(function(k){ var w = c.measureText(k).width + 32; pW.push(w); total += w; });
  total += 14 * (R.kw.length - 1);
  var px = (W - total) / 2;
  R.kw.forEach(function(k, i){
    c.fillStyle = '#FFE4EC';
    roundRect(c, px, pillY, pW[i], 36, 18); c.fill();
    c.fillStyle = '#FF5C85';
    c.fillText(k, px + pW[i] / 2, pillY + 25);
    px += pW[i] + 14;
  });
  y = pillY + 36 + 30;

  var heads = ['👀 一个画面', '🌱 这是这样的你', '✨ 一句话送给你'];
  for(var i = 0; i < 3; i++){
    var txt = R.insight[i];
    var isQ = (i === 2);
    var fs = isQ ? 25 : 23;
    var lh = isQ ? 40 : 36;
    c.font = (isQ ? '700 ' : '400 ') + fs + 'px ' + FS;
    var innerW = isQ ? CW - 60 : CW - 56;
    var n = lineCount(c, txt, innerW);
    var cardH = 34 + n * lh + 24;
    c.fillStyle = isQ ? '#FFF3F6' : '#FFFBF9';
    roundRect(c, PAD, y, CW, cardH, 20); c.fill();
    c.strokeStyle = isQ ? '#FFD5E0' : '#F5E7EC';
    c.lineWidth = 1.5; c.stroke();

    c.textAlign = 'left';
    c.fillStyle = '#FF5C85';
    c.font = '700 20px ' + EMO;
    c.fillText(heads[i], PAD + 24, y + 26);

    c.fillStyle = isQ ? '#C9385F' : '#4A3B45';
    c.font = (isQ ? '700 ' : '400 ') + fs + 'px ' + FS;
    wrapText(c, txt, isQ ? W / 2 : PAD + 28, y + 34 + lh - 10, innerW, lh, isQ ? 'center' : 'left');
    y += cardH + 16;
  }

  c.textAlign = 'left';
  c.fillStyle = '#A8929C';
  c.font = '500 18px ' + FS;
  c.fillText('六个侧面的浓度', PAD, y + 6);
  y += 26;
  var dc = dimCounts(answers);
  var mx = 0;
  Object.keys(dc).forEach(function(k){ if(dc[k] > mx) mx = dc[k]; });
  Object.keys(DIMS).forEach(function(k){
    c.fillStyle = '#7C6974';
    c.font = '400 18px ' + FS;
    c.textAlign = 'left';
    c.fillText(DIMS[k], PAD, y + 13);
    var tX = PAD + 126, tW = CW - 126 - 40;
    c.fillStyle = '#F8EDF1';
    roundRect(c, tX, y + 1, tW, 11, 5.5); c.fill();
    var wv = mx ? Math.round(tW * dc[k] / mx) : 0;
    c.fillStyle = '#FF8AA8';
    roundRect(c, tX, y + 1, Math.max(wv, dc[k] > 0 ? 10 : 3), 11, 5.5); c.fill();
    c.fillStyle = '#A8929C';
    c.textAlign = 'right';
    c.fillText(String(dc[k]), W - PAD, y + 13);
    y += 25;
  });

  y += 12;
  c.font = '400 19px ' + FS;
  var mlines = lineCount(c, R.match, CW - 56);
  var mH = 34 + mlines * 26 + 16;
  c.fillStyle = '#F7FBFF';
  roundRect(c, PAD, y, CW, mH, 20); c.fill();
  c.strokeStyle = '#E5EEF8'; c.lineWidth = 1.5; c.stroke();
  c.textAlign = 'left';
  c.fillStyle = '#4A7FB5';
  c.font = '600 18px ' + FS;
  c.fillText('适 配 关 系', PAD + 24, y + 26);
  c.fillStyle = '#5A6E80';
  c.font = '400 19px ' + FS;
  wrapText(c, R.match, PAD + 24, y + 54, CW - 56, 26, 'left');
  y += mH + 24;

  var gy = Math.min(y + 18, H - 88);
  c.textAlign = 'center';
  c.fillStyle = '#FF5C85';
  c.font = '600 21px ' + FS;
  c.fillText('@ 那个你想到的人，一起测测谁更上头', W / 2, gy);

  c.fillStyle = '#B7A6AE';
  c.font = '400 16px ' + FS;
  c.fillText('本测试为趣味娱乐内容，结果由算法生成，仅供娱乐参考，', W / 2, H - 46);
  c.fillText('不构成任何心理诊断或情感建议。', W / 2, H - 22);

  var url = cv.toDataURL('image/png');
  document.getElementById('posterImg').src = url;
  document.getElementById('posterDownload').href = url;
  document.getElementById('posterModal').classList.add('show');
}

});

});
