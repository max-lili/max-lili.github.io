/* ============ 口令门控 ============ */
var PASSCODE = "2612"; // 4 位数字口令，可自行修改此处

function verify(){
  var inp = document.getElementById('passInput');
  var msg = document.getElementById('gateMsg');
  var card = document.getElementById('gateCard');
  if(inp.value.trim() === PASSCODE){
    document.getElementById('gate').classList.add('hide');
    show('home');
  }else{
    msg.classList.add('on');
    card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');
    inp.value = ''; inp.focus();
  }
}
document.getElementById('verifyBtn').addEventListener('click', verify);
document.getElementById('passInput').addEventListener('input', function(){
  this.value = this.value.replace(/\D/g,'').slice(0,4);
});
document.getElementById('passInput').addEventListener('keydown', function(e){
  if(e.key === 'Enter') verify();
});

  ['home','quiz','result'].forEach(function(v){

}

function resolve(answers){
  var s = {};
  answers.forEach(function(ch,i){
    var code = QUESTIONS[i].options[ch].code;
    s[code] = (s[code]||0)+1;
  });
  var mx = Math.max.apply(null, Object.keys(s).map(function(k){return s[k];}));
  var tied = Object.keys(s).filter(function(k){return s[k]===mx;});
  var code;
  if(tied.length===1){ code = tied[0]; }
  else{
    var last = QUESTIONS[QUESTIONS.length-1].options[answers[QUESTIONS.length-1]].code;
    var first = QUESTIONS[0].options[answers[0]].code;
    if(tied.indexOf(last)>=0) code = last;
    else if(tied.indexOf(first)>=0) code = first;
    else code = tied.sort()[0];
  }
  return { code:code, scores:s };
}

/* ============ 答题流程 ============ */
var state = { idx:0, answers:[] };

function renderQuestion(){
  var q = QUESTIONS[state.idx];
  document.getElementById('qIndex').textContent = '第 '+(state.idx+1)+' / '+QUESTIONS.length+' 题';
  document.getElementById('progressFill').style.width = (state.idx/QUESTIONS.length*100)+'%';
  document.getElementById('qTitle').textContent = q.title;
  var box = document.getElementById('options');
  box.innerHTML = '';
  q.options.forEach(function(o, i){
    var div = document.createElement('div');
    div.className = 'option';
    div.innerHTML = '<span class="opt-key">'+o.key+'</span><span class="opt-text"></span>';
    div.querySelector('.opt-text').textContent = optionText(state.idx, i);
    div.addEventListener('click', function(){ pick(i); });
    box.appendChild(div);
  });
  document.getElementById('backBtn').style.visibility = state.idx===0 ? 'hidden' : 'visible';
}

function optionText(qi, oi){
  return QUESTIONS[qi].options[oi].text || QUESTIONS[qi].options[oi].label || '';
}

function pick(i){
  state.answers[state.idx] = i;
  if(state.idx < QUESTIONS.length-1){
    state.idx++;
    renderQuestion();
  }else{
    finish();
  }
}

document.getElementById('backBtn').addEventListener('click', function(){
  if(state.idx>0){ state.idx--; renderQuestion(); }
});

document.getElementById('startBtn').addEventListener('click', function(){
  state.idx = 0; state.answers = [];
  show('quiz'); renderQuestion();
});

var lastResultCode = null;

function finish(){
  var res = resolve(state.answers);
  lastResultCode = res.code;
  var r = RESULTS[res.code];
  document.getElementById('rArt').innerHTML = '<div class="result-art">'+artFor(res.code)+'</div>';
  document.getElementById('rEmoji').textContent = r.emoji;
  document.getElementById('rName').textContent = r.name;
  document.getElementById('rPersona').textContent = r.persona;
  document.getElementById('rScene').innerHTML = '<b>同款场景：</b>'+r.scene;
  document.getElementById('rMatch').innerHTML = '💞 '+r.match;
  var kwBox = document.getElementById('rKeywords');
  kwBox.innerHTML = '';
  r.kw.forEach(function(k){
    var s = document.createElement('span'); s.className='kw'; s.textContent=k; kwBox.appendChild(s);
  });
  var ins = document.getElementById('rInsight');
  ins.innerHTML = '';
  var tags = ['👀','🌱','✨'];
  r.insight.forEach(function(t, i){
    var p = document.createElement('p');
    p.className = i===2 ? 'gold' : 'insight-p';
    p.innerHTML = '<span class="tag">'+tags[i]+'</span>'+escapeHtml(t);
    ins.appendChild(p);
  });
  show('result');
}

function escapeHtml(s){
  return s.replace(/[&<>"']/g, function(m){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m];
  });
}

document.getElementById('againBtn').addEventListener('click', function(){
  state.idx = 0; state.answers = [];
  show('home');
});

/* ============ 海报生成 ============ */
var posterDataURL = null;

function wrapText(c, text, x, y, maxW, lineH){
  var line = '';
  for(var i=0;i<text.length;i++){
    var ch = text[i];
    if(c.measureText(line+ch).width > maxW && line.length>0){
      c.fillText(line, x, y); y += lineH; line = ch;
    }else{ line += ch; }
  }
  if(line){ c.fillText(line, x, y); y += lineH; }
  return y;
}

function countLines(c, text, maxW, lineH){
  var line = '', lines = 1;
  for(var i=0;i<text.length;i++){
    var ch = text[i];
    if(c.measureText(line+ch).width > maxW && line.length>0){
      lines++; line = ch;
    }else{ line += ch; }
  }
  return lines;
}

function wrapTextCenter(c, text, cx, y, maxW, lineH){
  var line = '';
  for(var i=0;i<text.length;i++){
    var ch = text[i];
    if(c.measureText(line+ch).width > maxW && line.length>0){
      c.fillText(line, cx, y); y += lineH; line = ch;
    }else{ line += ch; }
  }
  if(line){ c.fillText(line, cx, y); y += lineH; }
  return y;
}

function genPoster(){
  var code = lastResultCode;
  var r = RESULTS[code];
  var W = 750, H = 1500;
  var cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  var c = cv.getContext('2d');
  var PAD = 54, CW = W - PAD*2, y = 0;

  var g = c.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#FFF3E6'); g.addColorStop(1,'#FFE8D2');
  c.fillStyle = g; c.fillRect(0,0,W,H);

  c.textAlign = 'center';
  c.fillStyle = '#B5A49A'; c.font = '24px sans-serif';
  y = 72; c.fillText('我的出发家族人格', W/2, y);

  y += 76;
  c.font = '72px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
  c.fillText(r.emoji, W/2, y);

  y += 54;
  c.fillStyle = '#FCEBD8';
  roundRect(c, W/2-150, y-30, 300, 44, 22); c.fill();
  c.fillStyle = '#E8893A'; c.font = '24px sans-serif';
  c.fillText(DIMS[r.dim]+' · 出发家族', W/2, y+1);

  y += 62;
  c.textAlign = 'center';
  c.fillStyle = '#3A322E'; c.font = 'bold 34px sans-serif';
  y = wrapTextCenter(c, r.name, W/2, y, CW, 44);

  y += 12;
  c.fillStyle = '#7C6A60'; c.font = '25px sans-serif';
  y = wrapTextCenter(c, r.persona, W/2, y, CW, 36);

  y += 18;
  c.textAlign = 'left';
  var kx = PAD;
  c.font = '24px sans-serif';
  r.kw.forEach(function(k){
    var w = c.measureText(k).width + 36;
    c.fillStyle = '#FCEBD8'; roundRect(c, kx, y-26, w, 38, 19); c.fill();
    c.fillStyle = '#E8893A'; c.fillText(k, kx+18, y);
    kx += w + 14;
  });
  y += 52;

  var tags = ['👀','🌱','✨'];
  r.insight.forEach(function(t, i){
    var isGold = (i===2);
    var textMaxW = CW-44;
    if(isGold){
      c.font = 'bold 25px sans-serif';
      var lines = countLines(c, t, textMaxW, 36);
      var cardH = 28 + lines*36;
      c.fillStyle = '#FFF6EC';
      roundRect(c, PAD, y-12, CW, cardH, 18); c.fill();
      c.fillStyle = '#E8893A';
    }else{
      c.fillStyle = '#3A322E';
    }
    y += 14;
    c.textAlign = 'left';
    c.font = '24px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
    c.fillText(tags[i], PAD, y+24);
    c.font = (isGold?'bold 25px':'25px')+' sans-serif';
    y = wrapText(c, t, PAD+44, y+24, textMaxW, 36);
    y += 20;
  });

  y += 12;
  c.textAlign = 'center';
  c.fillStyle = '#7C6A60'; c.font = '24px sans-serif';
  c.fillText('@那个你想到的朋友，一起来测测谁和你最搭', W/2, y);

  c.fillStyle = '#B5A49A'; c.font = '18px sans-serif';
  c.fillText('本测试为趣味娱乐内容，结果由算法生成，仅供娱乐参考，不构成任何心理诊断或情感建议。', W/2, H-56);

  posterDataURL = cv.toDataURL('image/png');
  document.getElementById('posterImg').src = posterDataURL;
  document.getElementById('posterDownload').href = posterDataURL;
  document.getElementById('posterModal').classList.add('show');
}

function roundRect(c, x, y, w, h, r){
  c.beginPath();
  c.moveTo(x+r, y);
  c.arcTo(x+w, y, x+w, y+h, r);
  c.arcTo(x+w, y+h, x, y+h, r);
  c.arcTo(x, y+h, x, y, r);
  c.arcTo(x, y, x+w, y, r);
  c.closePath();
}

document.getElementById('posterBtn').addEventListener('click', genPoster);
document.getElementById('posterClose').addEventListener('click', function(){
  document.getElementById('posterModal').classList.remove('show');
});
