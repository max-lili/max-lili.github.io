<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>深宫人格图鉴 · 趣味测试</title>
<style>
  :root{
    --pink:#a63a2e; --pink-deep:#8c2b22; --pink-soft:#f3e3d8;
    --cream:#fffaf1; --ink:#2f3e46; --ink-2:#5a6668; --ink-3:#8a9390;
    --line:#e3d6bd; --gold:#b8893b;
    --shadow-sm:0 4px 18px rgba(140,70,40,.12);
    --shadow:0 12px 40px rgba(140,70,40,.18);
    --emoji:"Apple Color Emoji","Segoe UI Emoji","Segoe UI Symbol","Noto Color Emoji",sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:-apple-system,"PingFang SC","Microsoft YaHei","Noto Serif SC",serif;
    background:linear-gradient(135deg,#f7f0e2,#fdeee6);color:var(--ink);min-height:100vh}
  .wrap{max-width:520px;margin:0 auto;padding:28px 20px 48px}
  .view{display:none}
  .view.show{display:block;animation:fadeUp .5s ease both}
  @keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  @keyframes shake{0%,100%{transform:none}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
  .shake{animation:shake .4s ease}

  /* 口令门控 */
  #gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;
    padding:20px;background:linear-gradient(135deg,rgba(247,240,226,.97),rgba(253,238,230,.97));
    backdrop-filter:blur(8px)}
  #gate.hide{display:none}
  .gate-card{background:#fff;border:1px solid var(--line);border-radius:26px;box-shadow:var(--shadow);
    padding:38px 30px 32px;width:100%;max-width:400px;text-align:center}
  .gate-lock{font-size:46px;margin-bottom:8px;font-family:var(--emoji)}
  .gate-card h2{font-size:21px;margin:0 0 8px}
  .gsub{font-size:13.5px;color:var(--ink-2);line-height:1.6;margin:0 0 22px}
  #passInput{width:100%;text-align:center;font-size:22px;letter-spacing:10px;font-weight:800;
    padding:14px 12px 14px 24px;border:2px solid var(--pink-soft);border-radius:14px;
    color:var(--ink);font-family:inherit;outline:none;background:#fffafc}
  #passInput:focus{border-color:var(--pink);box-shadow:0 0 0 4px rgba(166,58,46,.12)}
  .gate-msg{height:20px;font-size:12.5px;color:var(--pink-deep);margin:6px 0 12px;opacity:0;transition:opacity .2s}
  .gate-msg.on{opacity:1}
  .gate-foot{font-size:11px;color:var(--ink-3);margin:18px 0 0}

  /* 通用组件 */
  .btn{display:block;width:100%;border:0;border-radius:14px;padding:15px;font-size:16px;font-weight:800;
    color:#fff;background:linear-gradient(135deg,var(--pink),var(--pink-deep));
    box-shadow:var(--shadow-sm);cursor:pointer;font-family:inherit;margin-top:12px}
  .btn.ghost{background:#fff;color:var(--pink-deep);border:1.5px solid var(--pink-soft);box-shadow:none}
  .card{background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow-sm);
    padding:20px;margin-bottom:16px}
  h1{font-size:28px;line-height:1.3;margin:6px 0 14px}
  h1 .hl{color:var(--pink-deep)}
  .eyebrow{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--pink-deep);
    background:var(--pink-soft);padding:4px 11px;border-radius:999px}
  .progress-track{height:8px;background:var(--pink-soft);border-radius:99px;overflow:hidden;margin:14px 0}
  .bar-fill{display:block;height:100%;width:0;border-radius:99px;
    background:linear-gradient(90deg,var(--gold),var(--pink));transition:width .8s ease}
  .option{display:flex;align-items:center;gap:12px;padding:14px;border:1.5px solid var(--line);
    border-radius:14px;margin-bottom:10px;cursor:pointer;background:#fff;transition:.18s}
  .option:hover{transform:translateY(-2px);border-color:var(--pink-soft)}
  .option.on{border-color:var(--pink);background:#fdf3ee}
  .opt-tag{flex:none;width:30px;height:30px;border:1px solid var(--gold);border-radius:50%;
    display:flex;align-items:center;justify-content:center;color:var(--gold);font-weight:700;font-size:14px}
  .option.on .opt-tag{background:var(--pink);border-color:var(--pink);color:#fff}
  .type-emoji{font-size:56px;line-height:1;margin-bottom:8px;font-family:var(--emoji)}
  .kw{display:inline-block;font-size:12px;color:var(--pink-deep);background:var(--pink-soft);
    padding:4px 11px;border-radius:999px;margin:0 6px 6px 0}
  .disclaimer{font-size:11px;color:var(--ink-3);line-height:1.6;text-align:center;margin-top:24px}
  .insight-block{margin:16px 0}
  .insight-block .lab{font-size:13px;font-weight:800;color:var(--gold);margin-bottom:6px}
  .insight-block p{font-size:15px;line-height:1.8;color:var(--ink);margin:0}
  .insight-block.gold p{background:linear-gradient(135deg,#fff7ec,#fdf3ee);border-left:3px solid var(--gold);
    padding:12px 14px;border-radius:10px;font-weight:700;color:var(--pink-deep)}
  .match{font-size:13.5px;color:var(--ink-2);line-height:1.7;margin-top:14px}

  /* 海报弹层 */
  #posterModal{display:none;position:fixed;inset:0;z-index:9998;background:rgba(47,62,70,.6);
    align-items:center;justify-content:center;padding:20px}
  #posterModal.show{display:flex}
  .poster-box{background:#fff;border-radius:20px;padding:16px;max-width:400px;width:100%;text-align:center}
  #posterImg{width:100%;border-radius:12px;display:block}
  #toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%) translateY(20px);
    background:rgba(47,62,70,.92);color:#fff;padding:10px 20px;border-radius:99px;font-size:13px;
    opacity:0;pointer-events:none;transition:.3s;z-index:10000}
  #toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="wrap">

  <!-- 视图1：口令门控 -->
  <div id="gate">
    <div class="gate-card" id="gateCard">
      <div class="gate-lock">🔑</div>
      <h2>输入口令开启测试</h2>

             autocomplete="off" placeholder="请输入 4 位口令">
      <div class="gate-msg" id="gateMsg">口令不对，再试一次～</div>
      <button class="btn" id="verifyBtn">进入测试 →</button>
      <p class="gate-foot">🔒 纯本地运行，无需联网、不收集任何信息</p>
    </div>
  </div>

  <!-- 视图2：首页 -->
  <section id="home" class="view">
    <span class="eyebrow">✨ 趣味测试</span>
    <h1>深宫人格<span class="hl">图鉴</span></h1>
    <p class="gsub">12 道情景小题，看清自己骨子里的处世模样。不问历史知识，只凭第一反应选择场景偏好；没有标准答案，不制造焦虑，图个乐、照见性格侧面。</p>
    <button class="btn" id="startBtn">开始测试 →</button>
  </section>

  <!-- 视图3：答题页 -->
  <section id="quiz" class="view">
    <div class="progress-track"><div class="bar-fill" id="progressFill"></div></div>
    <p id="qIndex" class="gsub">第 1 / 12 题</p>
    <div class="card">
      <h2 id="qTitle" style="margin-top:0">题干</h2>
      <div id="options"><!-- 选项由 JS 渲染 --></div>
    </div>
    <button class="btn ghost" id="backBtn">← 上一题</button>
  </section>

  <!-- 视图4：结果页 -->
  <section id="result" class="view">
    <div class="card" id="resultContent">
      <div class="type-emoji" id="rEmoji">🎀</div>
      <h2 id="rName" style="margin:0 0 6px">结果类型</h2>
      <p class="gsub" id="rPersona">一句话人设</p>
      <div id="rKeywords"></div>
      <div id="rInsight"></div>
      <p class="match" id="rMatch"></p>
    </div>
    <button class="btn" id="posterBtn">🖼️ 生成我的结果海报</button>
    <button class="btn ghost" id="againBtn">🔄 再测一次</button>
    <p class="disclaimer">本测试为趣味娱乐内容，结果由算法生成，仅供娱乐参考，不构成任何心理诊断或情感建议。</p>
  </section>

</div>

<!-- 海报预览弹层 -->
<div id="posterModal">
  <div class="poster-box">
    <img id="posterImg" alt="结果海报">
    <a class="btn" id="posterDownload" href="#" download="我的结果海报.png">⬇️ 保存图片</a>
    <button class="btn ghost" id="posterClose">关闭</button>
  </div>
</div>
<div id="toast"></div>

<script>
/* ============ 口令门控 ============ */
var PASSCODE = "8595"; // 4 位数字口令，可自行修改此处

function verify(){
  var inp = document.getElementById('passInput');
  var msg = document.getElementById('gateMsg');
  var card = document.getElementById('gateCard');
  if(inp.value.trim() === PASSCODE){
    document.getElementById('gate').classList.add('hide');
    show('home');
  }else{
    msg.classList.add('on');
    card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');
    inp.value = ''; inp.focus();
  }
}
document.getElementById('verifyBtn').addEventListener('click', verify);
document.getElementById('passInput').addEventListener('input', function(){
  this.value = this.value.replace(/\D/g,'').slice(0,4);
});
document.getElementById('passInput').addEventListener('keydown', function(e){
  if(e.key === 'Enter') verify();
});

function resolve(answers){
  var s = {};
  answers.forEach(function(ch,i){ var code=QUESTIONS[i].options[ch].code; s[code]=(s[code]||0)+1; });
  var mx = Math.max.apply(null, Object.keys(s).map(function(k){return s[k];}));
  var tied = Object.keys(s).filter(function(k){return s[k]===mx;});
  var code;
  if(tied.length===1){ code = tied[0]; }
  else{
    var last = QUESTIONS[QUESTIONS.length-1].options[answers[QUESTIONS.length-1]].code;
    var first = QUESTIONS[0].options[answers[0]].code;
    if(tied.indexOf(last)>=0) code = last;
    else if(tied.indexOf(first)>=0) code = first;
    else code = tied.sort()[0];
  }
  return { code:code, scores:s };
}

/* ============ 视图切换 ============ */
function show(id){
  ['home','quiz','result'].forEach(function(v){
    document.getElementById(v).classList.toggle('show', v === id);
  });
  window.scrollTo(0,0);
}

/* ============ 答题渲染 ============ */
var state = { answers:new Array(QUESTIONS.length).fill(null), current:0, lastCode:null };

function renderQuiz(){
  var i = state.current, item = QUESTIONS[i];
  document.getElementById('qIndex').textContent = '第 ' + (i+1) + ' / ' + QUESTIONS.length + ' 题';
  document.getElementById('progressFill').style.width = ((i+1)/QUESTIONS.length*100) + '%';
  document.getElementById('qTitle').textContent = item.title;
  document.getElementById('backBtn').disabled = i===0;
  document.getElementById('backBtn').style.opacity = i===0 ? .35 : 1;
  var box = document.getElementById('options');
  box.innerHTML = '';
  item.options.forEach(function(opt, idx){
    var btn = document.createElement('button');
    btn.className = 'option' + (state.answers[i]===idx ? ' on' : '');
    btn.innerHTML = '<span class="opt-tag">'+opt.key+'</span><span>'+opt.text+'</span>';
    btn.onclick = function(){ chooseOption(idx); };
    box.appendChild(btn);
  });
}

function chooseOption(idx){
  state.answers[state.current] = idx;
  if(state.current < QUESTIONS.length-1){
    state.current++;
    renderQuiz();
  }else{
    finishQuiz();
  }
}

function prevQuestion(){
  if(state.current>0){ state.current--; renderQuiz(); }
}

function finishQuiz(){
  var r = resolve(state.answers);
  state.lastCode = r.code;
  window.lastResultCode = r.code;
  renderResult(r.code);
  show('result');
}

function renderResult(code){
  var r = RESULTS[code];
  var dim = DIMS[code.charAt(0)];
  document.getElementById('rEmoji').textContent = r.emoji;
  document.getElementById('rName').textContent = dim + ' · ' + r.name;
  document.getElementById('rPersona').textContent = r.persona;
  document.getElementById('rKeywords').innerHTML = r.kw.map(function(k){return '<span class="kw">'+k+'</span>';}).join('');
  var labs = ['👀 一个画面','🌱 这是这样的你','✨ 一句话送给你'];
  var cls = ['','','gold'];
  document.getElementById('rInsight').innerHTML = r.insight.map(function(seg,i){
    return '<div class="insight-block '+cls[i]+'"><div class="lab">'+labs[i]+'</div><p>'+seg+'</p></div>';
  }).join('');
  document.getElementById('rMatch').textContent = r.match;
}

/* ============ 海报生成 ============ */
var EMOJI_FONT = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';

function wrapText(cv, ctx, text, x, y, maxW, lineH){
  var line = '';
  for(var i=0;i<text.length;i++){
    var ch = text[i];
    if(ctx.measureText(line+ch).width > maxW && line){
      ctx.fillText(line, x, y);
      y += lineH; line = ch;
    }else{ line += ch; }
  }
  if(line){ ctx.fillText(line, x, y); y += lineH; }
  return y;
}

function drawPoster(){
  var code = state.lastCode;
  var r = RESULTS[code];
  var dim = DIMS[code.charAt(0)];
  var W = 750, H = 1500, PAD = 54, CW = W - PAD*2;
  var cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  var c = cv.getContext('2d');

  var g = c.createLinearGradient(0,0,W,H);
  g.addColorStop(0,'#fdf3ee'); g.addColorStop(1,'#fff7ec');
  c.fillStyle = g; c.fillRect(0,0,W,H);

  var y = 70;
  c.textAlign = 'center';
  c.fillStyle = '#8a9390'; c.font = '26px "PingFang SC","Microsoft YaHei",sans-serif';
  c.fillText('我的深宫人格', W/2, y);
  y += 70;

  c.font = '104px ' + EMOJI_FONT;
  c.fillText(r.emoji, W/2, y + 52);
  y += 110;

  c.fillStyle = '#a63a2e'; c.font = '700 40px "PingFang SC","Microsoft YaHei",sans-serif';
  c.fillText(dim + ' · ' + r.name, W/2, y);
  y += 44;
  c.fillStyle = '#b8893b'; c.font = '26px "PingFang SC","Microsoft YaHei",sans-serif';
  c.fillText(r.persona, W/2, y);
  y += 40;

  // 关键词胶囊
  var kws = r.kw;
  var kwW = kws.map(function(k){ return c.measureText(k).width; });
  c.font = '24px "PingFang SC","Microsoft YaHei",sans-serif';
  var total = kwW.reduce(function(a,b){return a+b;},0) + (kws.length-1)*24 + kws.length*36;
  var kx = (W-total)/2;
  kws.forEach(function(k,i){
    var w = kwW[i]+36;
    c.fillStyle = '#f3e3d8';
    c.beginPath(); c.roundRect(kx, y-26, w, 40, 20); c.fill();
    c.fillStyle = '#8c2b22'; c.textAlign='center';
    c.fillText(k, kx+w/2, y+2);
    kx += w + 24;
  });
  y += 70;

  // 三段解读
  var labs = ['👀 一个画面','🌱 这是这样的你','✨ 一句话送给你'];
  c.textAlign = 'left';
  r.insight.forEach(function(seg,i){
    c.fillStyle = '#b8893b'; c.font = '700 26px "PingFang SC","Microsoft YaHei",sans-serif';
    c.fillText(labs[i], PAD, y); y += 38;
    c.fillStyle = i===2 ? '#8c2b22' : '#2f3e46';
    c.font = (i===2?'700 ':'400 ')+'26px "PingFang SC","Microsoft YaHei",sans-serif';
    y = wrapText(cv, c, seg, PAD, y, CW, 38);
    y += 22;
  });

  // 四维能量条
  y += 10;
  c.font = '24px "PingFang SC","Microsoft YaHei",sans-serif';
  Object.keys(DIMS).forEach(function(k){
    var val = k===code.charAt(0) ? 90 : [58,52,46][Object.keys(DIMS).indexOf(k)%3];
    c.fillStyle = '#5a6668'; c.textAlign='left';
    c.fillText(DIMS[k], PAD, y+24);
    var barX = PAD+170, barW = CW-170, barH = 16;
    c.fillStyle = '#f3e3d8';
    c.beginPath(); c.roundRect(barX, y+10, barW, barH, 8); c.fill();
    var fg = c.createLinearGradient(barX,0,barX+barW,0);
    fg.addColorStop(0,'#b8893b'); fg.addColorStop(1,'#a63a2e');
    c.fillStyle = fg;
    c.beginPath(); c.roundRect(barX, y+10, barW*val/100, barH, 8); c.fill();
    y += 44;
  });

  y += 16;
  c.textAlign = 'center';
  c.fillStyle = '#5a6668'; c.font = '24px "PingFang SC","Microsoft YaHei",sans-serif';
  c.fillText('@那个你想到的人，一起测测谁和你最搭', W/2, y);
  y += 56;

  c.textAlign = 'left';
  c.fillStyle = '#8a9390'; c.font = '20px "PingFang SC","Microsoft YaHei",sans-serif';
  var disc = '本测试为趣味娱乐内容，结果由算法生成，仅供娱乐参考，不构成任何心理诊断或情感建议。';
  wrapText(cv, c, disc, PAD, y, CW, 30);

  var dataURL = cv.toDataURL('image/png');
  document.getElementById('posterImg').src = dataURL;
  var dl = document.getElementById('posterDownload');
  dl.href = dataURL;
  document.getElementById('posterModal').classList.add('show');
}

/* ============ 事件绑定 ============ */
document.getElementById('startBtn').addEventListener('click', function(){ state.current=0; state.answers=new Array(QUESTIONS.length).fill(null); renderQuiz(); show('quiz'); });
document.getElementById('backBtn').addEventListener('click', prevQuestion);
document.getElementById('againBtn').addEventListener('click', function(){ show('home'); });
document.getElementById('posterBtn').addEventListener('click', drawPoster);
document.getElementById('posterClose').addEventListener('click', function(){
  document.getElementById('posterModal').classList.remove('show');
});
