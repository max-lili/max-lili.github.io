<style>

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

  .wrap{max-width:520px;margin:0 auto;padding:28px 20px 48px}

  #gate.hide{display:none}
  .gate-card{background:var(--card);border:1px solid var(--line);border-radius:26px;box-shadow:var(--shadow);
    padding:38px 30px 32px;width:100%;max-width:400px;text-align:center}
  .gate-lock{font-size:46px;margin-bottom:8px;font-family:var(--emoji)}
  .gate-card h2{font-size:21px;margin:0 0 8px}
  .gsub{font-size:13.5px;color:var(--ink-2);line-height:1.6;margin:0 0 22px}
  #passInput{width:100%;text-align:center;font-size:22px;letter-spacing:10px;font-weight:800;
    padding:14px 12px 14px 24px;border:2px solid var(--line);border-radius:14px;
    color:var(--ink);font-family:inherit;outline:none;background:var(--bg2)}
  #passInput:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(255,210,31,.12)}
  .gate-msg{height:20px;font-size:12.5px;color:var(--rose);margin:6px 0 12px;opacity:0;transition:opacity .2s}
  .gate-msg.on{opacity:1}
  .gate-foot{font-size:11px;color:var(--ink-3);margin:18px 0 0}

  /* 通用组件 */
  .btn{display:block;width:100%;border:0;border-radius:14px;padding:15px;font-size:16px;font-weight:800;
    color:#141414;background:linear-gradient(135deg,var(--accent),var(--accent-deep));
    box-shadow:var(--shadow-sm);cursor:pointer;font-family:inherit;margin-top:12px}
  .btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent);box-shadow:none}
  .card{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow-sm);
    padding:20px;margin-bottom:16px}
  h1{font-size:28px;line-height:1.3;margin:6px 0 14px}
  h1 .hl{color:var(--accent)}
  .eyebrow{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--accent);
    background:rgba(255,210,31,.12);padding:4px 11px;border-radius:999px}
  .progress-track{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:14px 0}
  .bar-fill{display:block;height:100%;width:0;border-radius:99px;
    background:linear-gradient(90deg,var(--accent),var(--accent-deep));transition:width .8s ease}
  .option{display:flex;align-items:center;gap:12px;padding:14px;border:1.5px solid var(--line);
    border-radius:14px;margin-bottom:10px;cursor:pointer;background:var(--card2);transition:.18s}
  .option:hover{transform:translateY(-2px);border-color:var(--accent)}
  .option.on{border-color:var(--accent);background:rgba(255,210,31,.1)}
  .opt-key{flex:0 0 28px;height:28px;border-radius:9px;display:flex;align-items:center;justify-content:center;
    font-weight:800;font-size:14px;background:var(--bg2);color:var(--accent);border:1px solid var(--line)}
  .option.on .opt-key{background:var(--accent);color:#141414;border-color:var(--accent)}
  .type-emoji{font-size:56px;line-height:1;margin-bottom:8px;font-family:var(--emoji)}
  .kw{display:inline-block;font-size:12px;color:var(--accent);background:rgba(255,210,31,.12);
    padding:4px 11px;border-radius:999px;margin:0 6px 6px 0}
  .roast{margin:14px 0;padding:13px 15px;border-left:3px solid var(--rose);background:rgba(255,77,109,.1);
    border-radius:0 12px 12px 0;font-size:15px;font-weight:700;color:#FFD9DF;line-height:1.6}
  .insight-p{margin:12px 0;font-size:14px;line-height:1.75;color:var(--ink-2)}
  .insight-p .lab{font-family:var(--emoji);margin-right:4px}
  .gold{color:var(--accent);font-weight:800;font-size:15.5px}
  .disclaimer{font-size:11px;color:var(--ink-3);line-height:1.6;text-align:center;margin-top:24px}
  .watermark{font-size:12px;color:var(--ink-3);text-align:center;margin-top:10px;letter-spacing:.5px}
  .art{width:100%;height:auto;border-radius:16px;margin-bottom:10px}

    opacity:0;pointer-events:none;transition:.3s;z-index:10000}
  #toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<script>

var PASSCODE = "6291"; // 4 位数字口令，可自行修改此处

function verify(){
  var inp = document.getElementById('passInput');
  var msg = document.getElementById('gateMsg');
  var card = document.getElementById('gateCard');
  if(inp.value.trim() === PASSCODE){
    document.getElementById('gate').classList.add('hide');
    show('home');
  }else{
    msg.classList.add('on');
    card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');
    inp.value = ''; inp.focus();
  }
}
document.getElementById('verifyBtn').addEventListener('click', verify);
document.getElementById('passInput').addEventListener('input', function(){
  this.value = this.value.replace(/\D/g,'').slice(0,4);
});
document.getElementById('passInput').addEventListener('keydown', function(e){
  if(e.key === 'Enter') verify();

/* ============ 计分逻辑 ============ */
function resolve(answers){
  var s = {};
  answers.forEach(function(ch,i){ var code=QUESTIONS[i].options[ch].code; s[code]=(s[code]||0)+1; });
  var mx = Math.max.apply(null, Object.keys(s).map(function(k){return s[k];}));
  var tied = Object.keys(s).filter(function(k){return s[k]===mx;});
  var code;
  if(tied.length===1){ code = tied[0]; }
  else{
    var last = QUESTIONS[QUESTIONS.length-1].options[answers[QUESTIONS.length-1]].code;
    var first = QUESTIONS[0].options[answers[0]].code;
    if(tied.indexOf(last)>=0) code = last;
    else if(tied.indexOf(first)>=0) code = first;
    else code = tied.sort()[0];
  }
  return { code:code, scores:s };
}

/* ============ 海报生成 ============ */
function wrapText(c, text, x, y, maxW, lineH){
  var line = '';
  for(var i=0;i<text.length;i++){
    var test = line + text[i];
    if(c.measureText(test).width > maxW && line){
      c.fillText(line, x, y); y += lineH; line = text[i];
    }else{ line = test; }
  }
  if(line){ c.fillText(line, x, y); y += lineH; }
  return y;
}

function drawPoster(code){

  var W = 750, H = 1500;

  cv.width = W; cv.height = H;
  var c = cv.getContext('2d');

  // 背景
  var g = c.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#17171E'); g.addColorStop(1,'#101014');
  c.fillStyle = g; c.fillRect(0,0,W,H);

  c.fillStyle = col; c.fillRect(0,0,W,14);

  c.textAlign = 'center';

  // 维度胶囊
  c.font = '24px "PingFang SC","Microsoft YaHei",sans-serif';
  var dimTxt = dim;
  var dw = c.measureText(dimTxt).width + 44;
  c.fillStyle = col; c.globalAlpha = .16;
  roundRect(c, W/2-dw/2, y-28, dw, 44, 22); c.fill(); c.globalAlpha = 1;
  c.fillStyle = col; c.fillText(dimTxt, W/2, y+2); y += 70;

  // 类型名
  c.fillStyle = '#F5F4EC'; c.font = 'bold 46px "PingFang SC","Microsoft YaHei",sans-serif';

  // 人设
  c.fillStyle = '#BCBAAF'; c.font = '25px "PingFang SC","Microsoft YaHei",sans-serif';
  y = wrapText(c, R.persona, W/2, y, CW, 34); y += 18;

  // 关键词胶囊
  c.font = '23px "PingFang SC","Microsoft YaHei",sans-serif';
  var kws = R.kw; var kx = W/2;
  var widths = kws.map(function(k){ return c.measureText(k).width + 36; });
  var total = widths.reduce(function(a,b){return a+b;},0) + (kws.length-1)*16;
  var startX = W/2 - total/2;
  kws.forEach(function(k,i){
    var w = widths[i];
    c.fillStyle = 'rgba(255,210,31,.12)';
    roundRect(c, startX, y-26, w, 40, 20); c.fill();
    c.fillStyle = '#FFD21F';
    c.fillText(k, startX + w/2, y+2);
    startX += w + 16;
  });
  y += 60;

  // 扎心短句卡
  c.textAlign = 'left';
  c.fillStyle = 'rgba(255,77,109,.12)';
  roundRect(c, PAD, y, CW, 116, 18); c.fill();
  c.fillStyle = '#FF4D6D'; c.fillRect(PAD, y, 6, 116);
  c.fillStyle = '#FFD9DF'; c.font = 'bold 27px "PingFang SC","Microsoft YaHei",sans-serif';
  y = wrapText(c, '扎心一句：' + R.roast, PAD+30, y+48, CW-56, 38);
  y += 30;

  // 三段解读
  c.font = '24px "PingFang SC","Microsoft YaHei",sans-serif';
  var labs = ['👀 一个画面','🌱 这是这样的你','✨ 一句话送给你'];
  R.insight.forEach(function(line, idx){
    c.fillStyle = col; c.font = 'bold 25px "PingFang SC","Microsoft YaHei",sans-serif';
    c.fillText(labs[idx], PAD, y); y += 36;
    c.fillStyle = idx===2 ? '#FFD21F' : '#BCBAAF';
    c.font = (idx===2 ? 'bold ' : '') + '24px "PingFang SC","Microsoft YaHei",sans-serif';
    y = wrapText(c, line, PAD, y, CW, 36);
    y += 18;
  });

  // @引导
  y += 10;
  c.textAlign = 'center';
  c.fillStyle = '#82817A'; c.font = '23px "PingFang SC","Microsoft YaHei",sans-serif';
  c.fillText(R.match + '，一起来测测', W/2, y);

  // 水印
  c.fillStyle = '#82817A'; c.font = '24px "PingFang SC","Microsoft YaHei",sans-serif';
  c.fillText(WATERMARK, W/2, H-70);

  // 免责声明
  c.fillStyle = '#6B6A64'; c.font = '18px "PingFang SC","Microsoft YaHei",sans-serif';
  c.fillText('本测试为趣味娱乐内容，仅供娱乐参考，不构成心理诊断或情感建议。', W/2, H-38);

  var dataURL = cv.toDataURL('image/png');
  return dataURL;
}
function roundRect(c,x,y,w,h,r){
  c.beginPath();
  c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r);
  c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath();
}

document.getElementById('posterBtn').addEventListener('click', function(){
  if(!currentCode) return;
  var url = drawPoster(currentCode);
  document.getElementById('posterImg').src = url;
  document.getElementById('posterDownload').href = url;
  document.getElementById('posterModal').classList.add('show');
});
document.getElementById('posterClose').addEventListener('click', function(){
  document.getElementById('posterModal').classList.remove('show');
});

document.getElementById('startBtn').addEventListener('click', function(){ answers=[]; q=0; renderQuestion(); show('quiz'); });
document.getElementById('againBtn').addEventListener('click', function(){ answers=[]; q=0; show('home'); });

function toast(msg){
  var t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('on');
  setTimeout(function(){ t.classList.remove('on'); }, 1800);
}
</script>
